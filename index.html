<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Factory</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        p {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #161b22;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }
        footer {
            margin-top: 50px;
            font-size: 0.85rem;
        }
        footer a {
            color: #8b949e;
            text-decoration: none;
        }
        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

    <h1>BS FACTORY</h1>

    <div class="links-container">

        <a href="https://www.instagram.com/bsfactory.official/" class="btn" target="_blank" rel="noopener">📷 Instagram</a>
    </div>

    <footer>
        <a href="impressum.html">Impressum</a>
